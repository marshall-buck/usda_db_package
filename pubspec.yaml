name: usda_db_package
description: >-
  Offline USDA SR Legacy food database for Flutter apps: lookup by id and
  substring autocomplete search over the bundled foods and nutrients.
version: 1.0.0
repository: https://github.com/marshall-buck/usda_db_package

environment:
  sdk: ^3.1.0

dependencies:
  equatable: ^2.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  very_good_analysis: ^6.0.0

flutter:
  assets:
    - lib/data/
